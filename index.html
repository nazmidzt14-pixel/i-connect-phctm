<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>i-Connect @ PHCTM — Clickable Prototype</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* ---- i-Connect Bold Blue / Coral — vivid, modern, energetic token system ---- */
    --ink:#0B0F1E;
    --ink-muted:#5B6478;
    --ink-faint:#9AA1B5;

    --blue-900:#050B22;   /* deepest panel bg (sidebar, auth visual, colour-block cards) */
    --blue-800:#0D1B4A;
    --blue-700:#2247E0;   /* primary interactive blue — bold & saturated */
    --blue-600:#3E63F5;   /* primary hover / lighter */
    --blue-100:#E4E9FE;   /* tint */
    --blue-050:#F1F4FF;

    --gold-600:#D8460F;   /* accent ink (coral-orange, darker) */
    --gold-500:#FF6B35;   /* bold accent — CTAs, highlights, marquee */
    --gold-100:#FFE7DC;   /* tint */

    --paper:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#F4F6FC;
    --border:#E4E7F3;
    --border-soft:#EEF0F9;

    --success:#1E9A5C;
    --success-bg:#E4F7EC;
    --grey-badge:#5B6478;
    --grey-badge-bg:#EEF0F6;
    --danger:#E5392A;
    --danger-bg:#FDEAE8;
    --warning:#C2760F;
    --warning-bg:#FDF0D9;

    --radius-sm:10px;
    --radius:18px;
    --radius-lg:28px;
    --radius-pill:999px;
    --shadow-xs:0 1px 2px rgba(11,15,30,.06);
    --shadow-sm:0 4px 14px rgba(11,15,30,.08), 0 1px 3px rgba(11,15,30,.06);
    --shadow-md:0 18px 40px rgba(11,15,30,.12), 0 3px 10px rgba(11,15,30,.06);
    --shadow-lg:0 32px 68px rgba(11,15,30,.18);

    --font-display:'Archivo', system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-body:'Inter', system-ui, -apple-system, "Segoe UI", sans-serif;
    font-family:var(--font-body);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{-webkit-tap-highlight-color:transparent;}
  body{
    color:var(--ink); line-height:1.55; -webkit-font-smoothing:antialiased; min-height:100vh;
    background:
      radial-gradient(ellipse 900px 520px at 10% -10%, rgba(34,71,224,.07), transparent 60%),
      radial-gradient(ellipse 760px 520px at 105% 6%, rgba(255,107,53,.07), transparent 55%),
      radial-gradient(ellipse 800px 520px at 50% 118%, rgba(34,71,224,.06), transparent 60%),
      radial-gradient(rgba(11,15,30,.05) 1px, transparent 1.4px) 0 0/24px 24px,
      var(--paper);
    background-attachment:fixed, fixed, fixed, fixed, fixed;
  }
  h1,h2,h3,h4{font-family:var(--font-display); color:var(--ink); font-weight:800; letter-spacing:-0.01em; line-height:1.1;}
  ::selection{background:var(--gold-100); color:var(--ink);}
  button{font-family:inherit; cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  .hidden{display:none !important;}
  a{color:inherit;}
  ::selection{background:var(--gold-100); color:var(--blue-900);}
  :focus-visible{outline:2.5px solid var(--gold-500); outline-offset:2px; border-radius:4px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }

  .eyebrow{
    font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--blue-600);
  }

  /* ---------- Prototype notice bar ---------- */
  .proto-bar{
    background:var(--blue-900); color:#fff; font-size:12.5px; padding:9px 16px;
    display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; text-align:center;
    position:relative; z-index:50;
  }
  .proto-bar b{color:var(--gold-500); font-weight:700;}
  .proto-bar button{
    background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.28);
    padding:4px 13px; border-radius:20px; font-size:11.5px; font-weight:600; transition:background .15s;
  }
  .proto-bar button:hover{background:rgba(255,255,255,.22);}
  .lang-switch{display:inline-flex; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.22); border-radius:20px; padding:2px;}
  .lang-switch button{
    background:transparent; color:rgba(255,255,255,.65); border:none; padding:4px 12px; border-radius:16px;
    font-size:11px; font-weight:700; letter-spacing:.03em; transition:background .15s, color .15s;
  }
  .lang-switch button:hover{background:rgba(255,255,255,.12); color:#fff;}
  .lang-switch button.active{background:var(--gold-500); color:var(--blue-900);}
  .lang-switch button.active:hover{background:var(--gold-500);}

  /* ---------- Brand mark (real UKM Library logo) ---------- */
  .brand{display:flex; align-items:center; gap:11px;}
  .brand-mark{
    height:28px; width:auto; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }
  .brand-mark img{ height:100%; width:auto; display:block; }
  .brand-text{line-height:1.15;}
  .brand-text strong{display:block; font-family:var(--font-body); font-weight:700; font-size:15.5px; letter-spacing:-.01em;}
  .brand-text span{font-size:10.5px; color:var(--ink-muted); letter-spacing:.05em; text-transform:uppercase;}

  /* ---------- Auth screen: split panel ---------- */
  .auth-shell{
    min-height:calc(100vh - 39px); display:flex; background:var(--surface);
  }
  .auth-visual{
    flex:1.15; position:relative; overflow:hidden; display:flex; flex-direction:column; justify-content:space-between;
    padding:52px 56px; color:#fff;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(240,180,41,.14), transparent 55%),
      radial-gradient(ellipse at 100% 100%, rgba(91,155,222,.10), transparent 45%),
      radial-gradient(rgba(255,255,255,.045) 1px, transparent 1.4px) 0 0/22px 22px,
      linear-gradient(155deg, #05070B, #0B1220 62%, #0F1A2C);
  }
  .auth-visual .brand-text strong, .auth-visual .brand-text span{color:#fff;}
  .auth-visual .brand-text span{color:rgba(255,255,255,.65);}
  .brand-row{display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
  .auth-logo-full{height:52px; width:auto; display:block;}
  .official-logos img{display:block;}
  .logo-ukm-crest{height:44px; width:auto;}
  .logo-hctm{height:32px; width:auto;}
  .logo-divider{width:1px; height:34px; background:rgba(255,255,255,.22); flex-shrink:0;}
  .auth-headline{margin-top:34px; max-width:460px;}
  .auth-headline h2{color:#fff; font-size:44px; font-weight:900; margin-bottom:16px; line-height:1.05; letter-spacing:-0.02em; text-transform:uppercase;}
  .auth-headline p{color:rgba(255,255,255,.74); font-size:16px; line-height:1.65;}
  .hero-cta-btn{margin-top:22px;}
  .hero-illustration{margin-top:28px; max-width:460px;}
  .hero-illustration svg{display:block; width:100%; height:auto; overflow:visible;}
  .hero-illustration .spin-slow{animation:heroSpin 14s linear infinite; transform-box:fill-box; transform-origin:center;}
  .hero-illustration .spin-slower{animation:heroSpin 22s linear infinite reverse; transform-box:fill-box; transform-origin:center;}
  .hero-illustration .float-a{animation:heroFloat 3.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center;}
  .hero-illustration .float-b{animation:heroFloat 4.4s ease-in-out infinite .5s; transform-box:fill-box; transform-origin:center;}
  .hero-illustration .float-c{animation:heroFloat 3.1s ease-in-out infinite 1s; transform-box:fill-box; transform-origin:center;}
  .hero-illustration .pulse-ring{animation:heroPulse 2.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center;}
  .hero-illustration .sway{animation:heroSway 4.5s ease-in-out infinite; transform-box:fill-box; transform-origin:bottom center;}
  .hero-illustration .twinkle{animation:heroTwinkle 2.6s ease-in-out infinite;}
  .hero-illustration .dash-flow{animation:heroDash 1.1s linear infinite;}
  @keyframes heroSpin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  @keyframes heroFloat{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
  @keyframes heroPulse{ 0%,100%{opacity:.4; transform:scale(1);} 50%{opacity:.85; transform:scale(1.15);} }
  @keyframes heroSway{ 0%,100%{transform:rotate(-4deg);} 50%{transform:rotate(4deg);} }
  @keyframes heroTwinkle{ 0%,100%{opacity:.2;} 50%{opacity:1;} }
  @keyframes heroDash{ to{stroke-dashoffset:-24;} }
  @media (prefers-reduced-motion: reduce){ .hero-illustration [class*="spin"],.hero-illustration [class*="float"],.hero-illustration .pulse-ring,.hero-illustration .sway,.hero-illustration .twinkle,.hero-illustration .dash-flow{animation:none !important;} }
  .auth-path{margin-top:26px; display:flex; flex-direction:column; gap:0;}

  /* Marquee ticker — signature element inspired by the reference site */
  .marquee{
    overflow:hidden; margin:30px -56px 0; padding:14px 0; border-top:1.5px solid rgba(255,255,255,.16); border-bottom:1.5px solid rgba(255,255,255,.16);
    -webkit-mask-image:linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
    mask-image:linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
  }
  .marquee-track{display:flex; align-items:center; width:max-content; animation:marqueeScroll 22s linear infinite;}
  .marquee-track span{
    font-family:var(--font-display); font-weight:800; font-size:14px; text-transform:uppercase; letter-spacing:.04em;
    color:#fff; white-space:nowrap; padding:0 20px;
  }
  .marquee-track .mq-dot{color:var(--gold-500); font-size:14px; padding:0;}
  @keyframes marqueeScroll{ from{transform:translateX(0);} to{transform:translateX(-50%);} }
  @media (prefers-reduced-motion: reduce){ .marquee-track{animation:none;} }
  .auth-path-item{display:flex; align-items:center; gap:16px; position:relative; padding-bottom:28px;}
  .auth-path-item:last-child{padding-bottom:0;}
  .auth-path-item::before{
    content:""; position:absolute; left:17px; top:36px; bottom:0; width:0; border-left:1.5px dashed rgba(255,255,255,.3);
  }
  .auth-path-item:last-child::before{display:none;}
  .auth-path-dot{
    width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.1); border:1.5px solid rgba(255,255,255,.3);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:14px; font-weight:700; color:#fff; z-index:1;
  }
  .auth-path-text strong{display:block; font-size:15px; font-weight:700; color:#fff;}
  .auth-path-text span{font-size:13px; color:rgba(255,255,255,.6);}
  .auth-foot-note{font-size:12.5px; color:rgba(255,255,255,.45); letter-spacing:.02em;}

  .auth-form-side{
    flex:1; display:flex; align-items:center; justify-content:center; padding:40px 32px; background:var(--surface);
  }
  .auth-card{width:100%; max-width:380px;}
  .auth-card .brand{margin-bottom:30px;}

  .auth-card h1{font-size:24px; margin-bottom:5px;}
  .auth-sub{color:var(--ink-muted); font-size:13.5px; margin-bottom:26px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; font-weight:700; margin-bottom:6px; color:var(--ink); letter-spacing:.01em;}
  .field input, .field select, .field textarea{
    width:100%; padding:11px 13px; border:1.5px solid var(--border); border-radius:9px; font-size:14px;
    background:var(--surface); transition:border-color .15s, box-shadow .15s; color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none; border-color:var(--blue-600); box-shadow:0 0 0 3.5px var(--blue-100);
  }
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .field-hint{font-size:11.5px; color:var(--ink-faint); margin-top:5px;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; border-radius:var(--radius-pill); font-weight:700; font-size:13.5px; padding:13px 26px;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .15s, background .15s, border-color .15s;
    white-space:nowrap; font-family:var(--font-body); letter-spacing:.01em;
  }
  .btn:active{transform:scale(.96);}
  .btn-primary{background:var(--gold-500); color:#fff; box-shadow:0 1px 2px rgba(11,15,30,.08), 0 6px 18px rgba(255,107,53,.32);}
  .btn-primary:hover{background:#FF7D4D; transform:translateY(-2px) scale(1.02); box-shadow:0 4px 10px rgba(11,15,30,.1), 0 10px 26px rgba(255,107,53,.38);}
  .btn-block{width:100%;}
  .btn-secondary{background:#fff; color:var(--blue-700); border:1.5px solid var(--blue-700);}
  .btn-secondary:hover{background:var(--blue-050); transform:translateY(-2px);}
  .btn-ghost{background:transparent; color:var(--ink-muted); border:1.5px solid var(--border);}
  .btn-ghost:hover{background:var(--border-soft); color:var(--ink);}
  .btn-danger-ghost{background:transparent; color:var(--danger); border:1.5px solid #F6D2CD;}
  .btn-danger-ghost:hover{background:var(--danger-bg);}
  .btn[disabled]{opacity:.4; cursor:not-allowed; pointer-events:none;}
  .btn-sm{padding:9px 18px; font-size:12.5px;}

  .auth-switch{text-align:center; font-size:13.5px; color:var(--ink-muted); margin-top:20px;}
  .auth-switch button{background:none; border:none; color:var(--blue-700); font-weight:700; font-size:13.5px;}

  /* ---------- App shell ---------- */
  .app-shell{display:flex; min-height:calc(100vh - 39px);}
  .sidebar{
    width:236px; background:var(--blue-900); color:#fff; flex-shrink:0; padding:22px 14px;
    display:flex; flex-direction:column; position:sticky; top:0; height:calc(100vh - 39px);
    background-image:radial-gradient(ellipse at 100% 0%, rgba(227,160,8,.09), transparent 45%);
  }
  .sidebar .brand{padding:2px 8px 24px; margin-bottom:8px; border-bottom:1px solid rgba(255,255,255,.1);}
  .sidebar .brand-text strong{color:#fff;}
  .sidebar .brand-text span{color:rgba(255,255,255,.5);}
  .nav-item{
    display:flex; align-items:center; gap:12px; padding:10.5px 14px; border-radius:9px;
    color:rgba(255,255,255,.68); font-size:13.5px; font-weight:600; background:none; border:none; border-left:2.5px solid transparent;
    width:100%; text-align:left; margin-bottom:2px; transition:background .12s, color .12s, border-color .12s;
  }
  .nav-item svg{flex-shrink:0; opacity:.8;}
  .nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
  .nav-item.active{background:rgba(255,255,255,.09); color:#fff; border-left-color:var(--gold-500);}
  .nav-item.active svg{opacity:1; color:var(--gold-500);}
  .nav-spacer{flex:1;}
  .sidebar-foot{border-top:1px solid rgba(255,255,255,.1); padding-top:10px; margin-top:10px;}

  .main{flex:1; display:flex; flex-direction:column; min-width:0;}
  .topbar{
    height:64px; background:rgba(255,255,255,.78); backdrop-filter:blur(10px); border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; padding:0 30px; position:sticky; top:0; z-index:5;
  }
  .topbar-title{font-family:var(--font-display); font-weight:800; font-size:19px;}
  .topbar-user{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--ink-muted); font-weight:500;}
  .avatar{
    width:33px; height:33px; border-radius:50%; background:var(--blue-100); color:var(--blue-700);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px; font-family:var(--font-display);
  }
  .menu-toggle{display:none; background:none; border:none; padding:6px; color:var(--ink);}

  .content{padding:34px 36px 70px; max-width:1160px; margin:0 auto; width:100%; animation:fadeUp .28s ease-out;}
  .content-narrow{max-width:640px;}
  .content-wide{max-width:1160px;}
  .dash-layout{display:grid; grid-template-columns:1fr 300px; gap:22px; align-items:start;}
  .rail{display:flex; flex-direction:column; gap:16px; position:sticky; top:20px;}
  .rail-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow-xs);}
  .rail-card h4{font-family:var(--font-body); font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-muted); margin-bottom:12px; display:flex; align-items:center; gap:8px;}
  .rail-hours{display:flex; justify-content:space-between; font-size:12.5px; padding:6px 0; border-bottom:1px dashed var(--border-soft); color:var(--ink-muted);}
  .rail-hours:last-child{border-bottom:none;}
  .rail-hours b{color:var(--ink); font-weight:600;}
  .rail-officer{display:flex; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--border-soft);}
  .rail-officer:last-child{border-bottom:none;}
  .rail-officer .oa{width:30px; height:30px; border-radius:50%; background:var(--blue-100); color:var(--blue-700); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; font-family:var(--font-body); flex-shrink:0;}
  .rail-officer .ot{font-size:11.5px; line-height:1.4;}
  .rail-officer .ot strong{display:block; font-size:12.5px; font-weight:600;}
  .rail-officer .ot span{color:var(--ink-faint);}
  @media (max-width: 980px){ .dash-layout{grid-template-columns:1fr;} .rail{position:static;} }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .page-head{margin-bottom:24px;}
  .page-head h1{font-size:30px; font-weight:900; margin-bottom:6px; letter-spacing:-0.02em;}
  .page-head p{color:var(--ink-muted); font-size:13.5px;}

  /* Dashboard */
  .stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:26px;}
  .stat-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:19px 21px; box-shadow:var(--shadow-xs);}
  .stat-card .num{font-family:var(--font-display); font-weight:900; font-size:34px; color:var(--blue-700);}
  .stat-card .lbl{font-size:12px; color:var(--ink-muted); margin-top:3px; font-weight:500;}
  .cta-card{
    background:
      radial-gradient(ellipse at 100% 0%, rgba(240,180,41,.16), transparent 55%),
      linear-gradient(135deg, #0B1220, #0F1A2C 70%, #13223A);
    border:1px solid var(--border);
    border-radius:var(--radius-lg); padding:30px 30px; color:#fff; display:flex; align-items:center;
    justify-content:space-between; gap:20px; margin-bottom:28px; flex-wrap:wrap; position:relative; overflow:hidden;
    box-shadow:var(--shadow-md);
  }
  .cta-card::after{
    content:""; position:absolute; right:-40px; top:-40px; width:180px; height:180px; border-radius:50%;
    border:1px dashed rgba(227,160,8,.35); pointer-events:none;
  }
  .cta-card h2{color:#fff; font-size:20px; margin-bottom:6px; font-weight:600;}
  .cta-card p{color:rgba(255,255,255,.75); font-size:13.5px; max-width:400px;}
  .cta-card .btn-primary{background:#fff; color:var(--blue-700); box-shadow:0 4px 14px rgba(0,0,0,.18);}
  .cta-card .btn-primary:hover{background:var(--blue-050); transform:translateY(-2px) scale(1.02);}

  .section-title{font-family:var(--font-body); font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-muted); margin-bottom:13px; display:flex; align-items:center; justify-content:space-between;}
  .section-title .link{font-size:12px; font-weight:700; color:var(--blue-700); font-family:var(--font-body);}

  /* Cards / lists */
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-xs);}
  .list-row{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border-soft); gap:14px; flex-wrap:wrap;}
  .admin-filters{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
  .admin-filter-btn{
    background:#fff; border:1.5px solid var(--border); border-radius:var(--radius-pill); padding:8px 16px;
    font-size:12.5px; font-weight:700; color:var(--ink-muted); display:flex; align-items:center; gap:7px;
    transition:all .15s; font-family:var(--font-body);
  }
  .admin-filter-btn:hover{border-color:var(--blue-700); color:var(--ink);}
  .admin-filter-btn.active{background:var(--blue-700); border-color:var(--blue-700); color:#fff;}
  .admin-filter-btn .cnt{background:rgba(11,15,30,.08); border-radius:999px; padding:1px 7px; font-size:11px;}
  .admin-filter-btn.active .cnt{background:rgba(255,255,255,.25);}
  .list-row:last-child{border-bottom:none;}
  .list-row-main{min-width:0;}
  .list-row-main .title{font-weight:700; font-size:14.5px;}
  .list-row-main .meta{font-size:12.5px; color:var(--ink-muted); margin-top:3px; line-height:1.6;}
  .empty-state{padding:40px 20px; text-align:center; color:var(--ink-faint); font-size:13.5px;}

  /* Stepper — dashed "referral" routing line */
  .stepper{display:flex; align-items:flex-start; margin-bottom:32px; overflow-x:auto; padding:6px 4px 4px;}
  .step{display:flex; flex-direction:column; align-items:center; flex:1; min-width:76px; position:relative;}
  .step::before{
    content:""; position:absolute; top:16px; left:-50%; width:100%; height:0; border-top:1.5px dashed var(--border); z-index:0;
  }
  .step:first-child::before{display:none;}
  .step.done::before{border-top-color:var(--blue-600); border-top-style:solid;}
  .step.active::before{border-top-color:var(--blue-600); border-top-style:solid;}
  .step-circle{
    width:32px; height:32px; border-radius:50%; background:var(--surface); border:1.5px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; color:var(--ink-faint);
    z-index:1; position:relative; font-family:var(--font-body); transition:all .15s;
  }
  .step.active .step-circle{
    border:1.5px solid var(--gold-500); background:var(--gold-500); color:var(--blue-900);
    box-shadow:0 0 0 4px var(--gold-100);
  }
  .step.done .step-circle{border-color:var(--blue-600); background:var(--blue-600); color:#fff;}
  .step-label{font-size:10.5px; color:var(--ink-faint); margin-top:7px; text-align:center; font-weight:600; max-width:80px;}
  .step.active .step-label{color:var(--ink);}
  .step.done .step-label{color:var(--ink-muted);}

  /* Service / officer cards */
  .service-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; margin-bottom:26px;}
  .pick-card{
    background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius); padding:19px;
    cursor:pointer; transition:border-color .15s, box-shadow .15s, background .15s, transform .18s cubic-bezier(.34,1.56,.64,1); text-align:left;
  }
  .pick-card:hover{border-color:var(--gold-500); box-shadow:var(--shadow-md); transform:translateY(-4px);}
  .pick-card.selected{border-color:var(--blue-700); background:var(--blue-050); box-shadow:var(--shadow-sm);}
  .pick-icon{
    width:40px; height:40px; border-radius:var(--radius-sm); background:var(--blue-100); color:var(--blue-700);
    display:flex; align-items:center; justify-content:center; margin-bottom:13px;
  }
  .pick-card.selected .pick-icon{background:var(--blue-700); color:#fff;}
  .pick-card h3{font-family:var(--font-body); font-size:14.5px; margin-bottom:6px; font-weight:700;}
  .pick-card p{font-size:12.5px; color:var(--ink-muted); line-height:1.55;}

  .officer-card{display:flex; gap:14px; align-items:flex-start;}
  .officer-avatar{
    width:46px; height:46px; border-radius:50%; background:var(--blue-100); color:var(--blue-700);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; flex-shrink:0;
    font-family:var(--font-body);
  }
  .pick-card.selected .officer-avatar{background:var(--blue-700); color:#fff;}
  .officer-info{flex:1; min-width:0;}
  .officer-info h3{font-family:var(--font-body); font-size:14.5px; margin-bottom:2px; font-weight:700;}
  .officer-info .role{font-size:11.5px; color:var(--gold-600); font-weight:700; margin-bottom:7px; text-transform:uppercase; letter-spacing:.02em;}
  .officer-info .contact{font-size:11.5px; color:var(--ink-muted); line-height:1.65;}

  /* Radio options */
  .radio-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:24px;}
  .radio-card{
    background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius); padding:21px; cursor:pointer;
    display:flex; align-items:center; gap:14px; transition:border-color .15s, background .15s, transform .18s cubic-bezier(.34,1.56,.64,1);
  }
  .radio-card:hover{border-color:var(--gold-500); transform:translateY(-3px); box-shadow:var(--shadow-sm);}
  .radio-card.selected{border-color:var(--blue-700); background:var(--blue-050);}
  .radio-dot{width:19px; height:19px; border-radius:50%; border:2px solid var(--border); flex-shrink:0; position:relative;}
  .radio-card.selected .radio-dot{border-color:var(--blue-700);}
  .radio-card.selected .radio-dot::after{
    content:""; position:absolute; inset:3px; border-radius:50%; background:var(--blue-700);
  }
  .radio-card .rtext strong{display:block; font-size:14.5px; margin-bottom:3px; font-weight:600;}
  .radio-card .rtext span{font-size:12px; color:var(--ink-muted);}

  /* Calendar */
  .cal-wrap{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:22px; max-width:400px; margin-bottom:24px; box-shadow:var(--shadow-xs);}
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:15px;}
  .cal-head strong{font-family:var(--font-display); font-size:16px; font-weight:800;}
  .cal-nav{display:flex; gap:6px;}
  .cal-nav button{width:28px; height:28px; border-radius:7px; border:1px solid var(--border); background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--ink-muted);}
  .cal-nav button:hover{background:var(--border-soft); color:var(--ink);}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
  .cal-dow{font-size:10.5px; color:var(--ink-faint); text-align:center; font-weight:700; padding-bottom:5px;}
  .cal-day{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:8px; font-size:13px;
    border:1.5px solid transparent; background:none; color:var(--ink); font-weight:600;
  }
  .cal-day.blank{visibility:hidden;}
  .cal-day.disabled{color:var(--ink-faint); opacity:.5; cursor:not-allowed;}
  .cal-day.enabled:hover{background:var(--blue-050); border-color:var(--blue-600);}
  .cal-day.selected{background:var(--blue-700); color:#fff;}
  .cal-day.today:not(.selected){border-color:var(--gold-500); color:var(--gold-600);}
  .cal-legend{display:flex; gap:14px; margin-top:15px; font-size:10.5px; color:var(--ink-muted); flex-wrap:wrap;}
  .cal-legend span{display:inline-flex; align-items:center; gap:5px;}
  .dot{width:8px; height:8px; border-radius:50%; display:inline-block;}

  /* Time slots */
  .slot-grid{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:24px;}
  .slot-btn{
    background:var(--surface); border:1.5px solid var(--border); border-radius:10px; padding:14px 21px; min-width:132px;
    text-align:center; font-weight:700; font-size:14px; transition:border-color .12s, background .12s, color .12s;
  }
  .slot-btn:hover:not([disabled]){border-color:var(--blue-600); background:var(--blue-050);}
  .slot-btn.selected{border-color:var(--blue-700); background:var(--blue-700); color:#fff;}
  .slot-btn[disabled]{background:var(--surface-2); color:var(--ink-faint); border-color:var(--border); cursor:not-allowed;}
  .slot-btn[disabled] .sub{color:var(--ink-faint);}
  .slot-btn .sub{display:block; font-size:10.5px; font-weight:600; color:var(--ink-muted); margin-top:2px;}
  .slot-btn.selected .sub{color:rgba(255,255,255,.75);}

  /* Summary */
  .summary-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:24px; box-shadow:var(--shadow-xs);}
  .summary-row{display:flex; justify-content:space-between; padding:13.5px 21px; border-bottom:1px solid var(--border-soft); font-size:13.5px; gap:20px;}
  .summary-row:last-child{border-bottom:none;}
  .summary-row .k{color:var(--ink-muted); font-weight:600;}
  .summary-row .v{font-weight:700; text-align:right;}

  /* Badges */
  .badge{display:inline-block; padding:5px 13px; border-radius:var(--radius-pill); font-size:10.5px; font-weight:800; letter-spacing:.04em; text-transform:uppercase;}
  .badge-upcoming{background:var(--success-bg); color:var(--success);}
  .badge-completed{background:var(--grey-badge-bg); color:var(--grey-badge);}
  .badge-cancelled{background:var(--danger-bg); color:var(--danger);}
  .badge-rescheduled{background:var(--warning-bg); color:var(--warning);}

  /* Wizard nav */
  .wizard-actions{display:flex; justify-content:space-between; align-items:center; margin-top:8px;}

  /* ---------- Success page: library stamp signature ---------- */
  .success-wrap{text-align:center; max-width:460px; margin:6px auto 0;}
  .stamp{
    width:128px; height:128px; margin:0 auto 22px; position:relative;
    animation:stampDown .5s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes stampDown{
    0%{ transform:scale(1.5) rotate(-18deg); opacity:0; }
    60%{ transform:scale(.94) rotate(-8deg); opacity:1; }
    100%{ transform:scale(1) rotate(-8deg); opacity:1; }
  }
  .stamp-ring{
    width:100%; height:100%; border-radius:50%; border:3px solid var(--gold-600);
    display:flex; align-items:center; justify-content:center; position:relative; color:var(--gold-600);
  }
  .stamp-ring::before{
    content:""; position:absolute; inset:8px; border-radius:50%; border:1px solid var(--gold-600); opacity:.6;
  }
  .stamp-text{
    font-family:var(--font-body); font-weight:800; font-size:14px; letter-spacing:.06em; line-height:1.15;
    text-transform:uppercase; color:var(--gold-600);
  }
  .stamp-sub{font-size:9px; letter-spacing:.15em; font-weight:700; color:var(--gold-600); text-transform:uppercase; margin-top:2px;}
  .success-wrap h1{font-size:22px; margin-bottom:7px;}
  .success-wrap p{color:var(--ink-muted); font-size:13.5px; margin-bottom:24px;}
  .success-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:22px;}

  textarea{resize:vertical; min-height:96px;}

  /* Toasts */
  #toast-container{position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:10px; z-index:100;}
  .toast{
    background:var(--blue-900); color:#fff; border:1px solid rgba(255,255,255,.08); padding:12px 18px; border-radius:10px; font-size:13.5px; font-weight:600;
    box-shadow:var(--shadow-md); display:flex; align-items:center; gap:10px; animation:slideIn .18s ease-out; max-width:320px;
  }
  .toast.success{background:var(--success); color:#fff; border-color:transparent;}
  .toast.error{background:var(--danger); color:#fff; border-color:transparent;}
  @keyframes slideIn{from{transform:translateY(8px); opacity:0;} to{transform:translateY(0); opacity:1;}}

  /* Modal */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(14,24,38,.5); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center;
    z-index:90; padding:20px;
  }
  .modal{background:var(--surface-2); border:1px solid var(--border); border-radius:16px; padding:27px; max-width:380px; width:100%; box-shadow:var(--shadow-lg); animation:fadeUp .18s ease-out;}
  .modal h3{font-size:16.5px; margin-bottom:9px;}
  .modal p{font-size:13.5px; color:var(--ink-muted); margin-bottom:21px;}
  .modal-actions{display:flex; gap:10px; justify-content:flex-end;}

  .task-note{
    background:var(--gold-100); border:1px solid #FFCBB0; border-radius:var(--radius-sm); padding:12px 16px; font-size:12.5px;
    color:#B03D14; margin-bottom:20px; display:flex; gap:10px; align-items:flex-start;
  }

  /* Responsive */
  @media (max-width: 900px){
    .auth-visual{display:none;}
    .auth-form-side{flex:1;}
  }
  @media (max-width: 860px){
    .stat-grid{grid-template-columns:1fr 1fr;}
    .radio-grid{grid-template-columns:1fr;}
  }
  @media (max-width: 720px){
    .sidebar{
      position:fixed; left:0; top:39px; bottom:0; z-index:40; transform:translateX(-100%); transition:transform .2s;
      box-shadow:var(--shadow-md);
    }
    .sidebar.open{transform:translateX(0);}
    .menu-toggle{display:flex; align-items:center; justify-content:center;}
    .content{padding:22px 16px 50px;}
    .stat-grid{grid-template-columns:1fr;}
    .field-row{grid-template-columns:1fr;}
    .cta-card{flex-direction:column; align-items:flex-start;}
  }
</style>
</head>

/* ============================= HELPERS ============================= */
function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  if(state.lang==='ms'){
    const dow = DOW_LONG_MS[d.getDay()].slice(0,3);
    return `${d.getDate()} ${MONTHS_MS[d.getMonth()]} ${d.getFullYear()} (${dow})`;
  }
  return d.toLocaleDateString('en-GB',{ day:'numeric', month:'short', year:'numeric', weekday:'short' });
}
function dateKey(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function initials(name){ return name.replace(/^(TS\.|DR\.)\s*/i,'').split(' ').filter(w=>w.length>1||/[A-Za-z]/.test(w)).slice(0,2).map(w=>w[0]).join('').toUpperCase().slice(0,2); }
function toast(msg, type){
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast' + (type ? ' '+type : '');
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .25s'; t.style.opacity='0'; setTimeout(()=>t.remove(),250); }, 2600);
}
function serviceById(id){ return SERVICES.find(s=>s.id===id); }
function officerById(id){ return OFFICERS.find(o=>o.id===id); }

function timeLabelFrom24h(hhmmss){
  const [h,m] = hhmmss.split(':').map(Number);
  const period = h >= 12 ? 'PM' : 'AM';
  const h12 = ((h+11)%12)+1;
  return `${h12}:${String(m).padStart(2,'0')} ${period}`;
}

async function loadDirectory(){
  try{
    const [svcRes, tmRes, linkRes] = await Promise.all([
      sb.from('services').select('*'),
      sb.from('team_members').select('*'),
      sb.from('team_member_services').select('*'),
    ]);
    if(svcRes.error) throw svcRes.error;
    if(tmRes.error) throw tmRes.error;
    if(linkRes.error) throw linkRes.error;

    const iconMap = { penerbitan:'book', esumber:'db', kursus:'grad' };
    SERVICES = svcRes.data.map(s => ({
      id: s.id, slug: s.slug, name: s.name,
      desc: { en: s.description_en, ms: s.description_ms },
      icon: iconMap[s.slug] || 'book',
    }));
    OFFICERS = tmRes.data.map(o => ({
      id: o.id, slug: o.slug, name: o.name,
      role: { en: o.position_en, ms: o.position_ms },
      email: o.email, phone: o.phone,
      expertise: { en: o.expertise_en, ms: o.expertise_ms },
      services: linkRes.data.filter(l => l.team_member_id === o.id).map(l => l.service_id),
    }));
  } catch(e){
    console.error('loadDirectory error, guna data sandaran:', e);
  }
}

async function loadMyAppointments(){
  if(!state.user) return;
  const { data, error } = await sb.from('appointments')
    .select('*, services(name), team_members(name)')
    .eq('user_id', state.user.id)
    .order('appointment_date', { ascending:true });

async function loadBookedSlots(){
  const b = state.booking;
  state.bookedSlots = [];
  const { data, error } = await sb.from('appointments')
    .select('appointment_time')
    .eq('team_member_id', b.officer)
    .eq('appointment_date', b.date)
    .neq('status', 'Cancelled');
  if(error){ console.error('loadBookedSlots error:', error); return; }
  state.bookedSlots = (data||[]).map(r => r.appointment_time.slice(0,5));
}

function genSlots(startHHMM, endHHMM, stepMin){
  const slots = [];
  const [sh,sm] = startHHMM.split(':').map(Number);
  const [eh,em] = endHHMM.split(':').map(Number);
  let cur = sh*60+sm;
  const end = eh*60+em;
  while(cur + stepMin <= end){
    const h = String(Math.floor(cur/60)).padStart(2,'0');
    const m = String(cur%60).padStart(2,'0');
    slots.push(`${h}:${m}`);
    cur += stepMin;
  }
  return slots;
}

async function loadDayAvailability(){
  const b = state.booking;
  state.dayAvailability = { slots:[], closed:false, reason:'' };
  if(!b.date || !b.officer) return;

  const dow = new Date(b.date+'T00:00:00').getDay(); // 0=Sun..6=Sat
  const dowIso = dow===0 ? 7 : dow; // our schema uses 1=Mon..5=Fri

  const [tmplRes, overrideRes] = await Promise.all([
    sb.from('availability_templates').select('*')
      .eq('team_member_id', b.officer).eq('day_of_week', dowIso).maybeSingle(),
    sb.from('availability_overrides').select('*')
      .eq('team_member_id', b.officer).eq('date', b.date).maybeSingle(),
  ]);

  const override = overrideRes.data;
  if(override && override.is_available === false){
    state.dayAvailability = { slots:[], closed:true, reason: override.reason || '' };
    return;
  }

  let startTime, endTime, stepMin = 30;
  if(override && override.is_available === true && override.start_time && override.end_time){
    startTime = override.start_time.slice(0,5);
    endTime = override.end_time.slice(0,5);
  } else if(tmplRes.data){
    startTime = tmplRes.data.start_time.slice(0,5);
    endTime = tmplRes.data.end_time.slice(0,5);
    stepMin = tmplRes.data.slot_duration_minutes || 30;
  } else {
    state.dayAvailability = { slots:[], closed:true, reason:'' };
    return;
  }

  state.dayAvailability = { slots: genSlots(startTime, endTime, stepMin), closed:false, reason:'' };
}

function setBtnLoading(id, loading, loadingLabel){
  const btn = document.getElementById(id);
  if(!btn) return;
  if(loading){
    btn.dataset.originalText = btn.textContent;
    btn.textContent = loadingLabel || '...';
    btn.disabled = true;
  } else {
    if(btn.dataset.originalText) btn.textContent = btn.dataset.originalText;
    btn.disabled = false;
  }
}

async function loadProfile(userId){
  const { data, error } = await sb.from('profiles').select('*').eq('id', userId).single();

function isAdmin(){ return !!(state.user && state.user.role === 'admin'); }

async function doLogin(){
  const email = (document.getElementById('li-email').value || '').trim();
  const pass = document.getElementById('li-pass').value || '';
  if(!email || !pass){
    toast(state.lang==='ms' ? 'Sila isi emel dan kata laluan' : 'Please enter email and password','error');
    return;
  }
  setBtnLoading('login-btn', true, state.lang==='ms' ? 'Log masuk...' : 'Logging in...');
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  setBtnLoading('login-btn', false);
  if(error){ toast(error.message, 'error'); return; }
  const profile = await loadProfile(data.user.id);
  state.user = {
    id: data.user.id,
    name: profile ? profile.full_name : data.user.email,
    email: data.user.email,
    org: profile ? profile.organisation : '',
    role: profile ? profile.role : 'user'
  };
  await loadAppData();
  go('dashboard');
  toast(t('loginSuccessToast'),'success');
}

async function doRegister(){
  const name = (document.getElementById('rg-name').value || '').trim();
  const email = (document.getElementById('rg-email').value || '').trim();
  const phone = (document.getElementById('rg-phone').value || '').trim();
  const org = (document.getElementById('rg-org').value || '').trim();
  const pass = document.getElementById('rg-pass').value || '';
  const pass2 = document.getElementById('rg-pass2').value || '';

  if(!name || !email || !pass){
    toast(state.lang==='ms' ? 'Sila lengkapkan semua medan wajib' : 'Please fill in all required fields','error');
    return;
  }
  if(pass !== pass2){
    toast(state.lang==='ms' ? 'Kata laluan tidak sepadan' : 'Passwords do not match','error');
    return;
  }
  if(pass.length < 6){
    toast(state.lang==='ms' ? 'Kata laluan perlu sekurang-kurangnya 6 aksara' : 'Password must be at least 6 characters','error');
    return;
  }

  setBtnLoading('register-btn', true, state.lang==='ms' ? 'Mendaftar...' : 'Creating account...');
  const { data, error } = await sb.auth.signUp({
    email, password: pass,
    options: { data: { full_name: name, phone: phone, organisation: org } }
  });
  setBtnLoading('register-btn', false);
  if(error){ toast(error.message, 'error'); return; }

  if(data.session){
    state.user = { id: data.user.id, name, email, org, role: 'user' };
    await loadAppData();
    go('dashboard');
    toast(t('registerSuccessToast'),'success');
  } else {
    toast(state.lang==='ms'
      ? 'Akaun dicipta! Sila semak emel anda untuk sahkan akaun sebelum log masuk.'
      : 'Account created! Please check your email to confirm before logging in.', 'success');
    go('login');
  }
}

function doLogout(){
  sb.auth.signOut();
  state.user = null;
  go('login');
}

function doForgotPassword(){
  const email = prompt(state.lang==='ms'
    ? 'Masukkan emel anda untuk terima pautan set semula kata laluan:'
    : 'Enter your email to receive a password reset link:');
  if(!email) return;
  sb.auth.resetPasswordForEmail(email).then(({error})=>{
    if(error){ toast(error.message,'error'); return; }
    toast(t('pwResetToast'),'success');
  });
}

async function wizardNext(){

// Step 4
function step4Date(){
  const b = state.booking;
  const m = state.calMonth;
  const year = m.getFullYear(), month = m.getMonth();
  const firstDow = (new Date(year,month,1).getDay()+6)%7;
  const daysInMonth = new Date(year,month+1,0).getDate();
  const monthLabel = state.lang==='ms' ? `${MONTHS_MS[month]} ${year}` : m.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-day blank"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const key = dateKey(year,month,d);
    const dow = new Date(year,month,d).getDay();
    const isWeekend = dow===0 || dow===6;
    const cellDate = new Date(year,month,d);
    const isPast = cellDate < TODAY;
    const isToday = cellDate.getTime()===TODAY.getTime();
    const disabled = isWeekend || isPast;
    const selected = b.date===key;
    cells += `<button class="cal-day ${disabled?'disabled':'enabled'} ${selected?'selected':''} ${isToday?'today':''}"
      ${disabled?'disabled':`onclick="selectDate('${key}')"`}>${d}</button>`;
  }
  return `
    <div class="cal-wrap">
      <div class="cal-head">
        <span></span>
        <strong>${monthLabel}</strong>
        <div class="cal-nav">
          <button onclick="shiftMonth(-1)">${ICONS.chevL}</button>
          <button onclick="shiftMonth(1)">${ICONS.chevR}</button>
        </div>
      </div>
      <div class="cal-grid">
        ${DOW_SHORT[state.lang].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells}
      </div>
      <div class="cal-legend">
        <span><span class="dot" style="background:var(--gold-500);"></span>${t('legendToday')}</span>
        <span><span class="dot" style="background:var(--blue-700);"></span>${t('legendSelected')}</span>
        <span><span class="dot" style="background:#C7D0E0;"></span>${t('legendUnavailable')}</span>
      </div>
    </div>
    <p style="font-size:12px;color:var(--ink-muted);margin-top:-10px;margin-bottom:20px;">${t('tzNoteHtml')}</p>
    ${wizardNav(!!b.date)}
  `;
}
function shiftMonth(dir){
  const m = state.calMonth;
  const next = new Date(m.getFullYear(), m.getMonth()+dir, 1);
  if(next.getFullYear()===2026 && (next.getMonth()===7 || next.getMonth()===8)){
    state.calMonth = next; render();
  }
}
function selectDate(key){ state.booking.date = key; state.booking.time = null; state.bookedSlots = []; render(); }

// Step 5
function step5Time(){
  const b = state.booking;
  const day = state.dayAvailability || { slots:[], closed:false };
  const unavailable = state.bookedSlots || [];
  const daySlots = day.slots || [];
  const allBooked = daySlots.length > 0 && daySlots.every(t=>unavailable.includes(t));

  if(day.closed || daySlots.length === 0){
    return `
      <p style="font-size:13px;color:var(--ink-muted);margin-bottom:14px;">${t('availableSlotsForPrefix')} <strong style="color:var(--ink);">${fmtDate(b.date)}</strong></p>
      <div class="task-note">${state.lang==='ms' ? 'Pegawai ini tidak bertugas pada tarikh ini. Sila kembali dan pilih tarikh lain.' : 'This officer is not available on this date. Please go back and pick another date.'}</div>
      ${wizardNav(false)}
    `;
  }

  return `
    <p style="font-size:13px;color:var(--ink-muted);margin-bottom:14px;">${t('availableSlotsForPrefix')} <strong style="color:var(--ink);">${fmtDate(b.date)}</strong></p>
    ${allBooked ? `<div class="task-note">${t('allBookedNote')}</div>` : ''}
    <div class="slot-grid">
      ${daySlots.map(time24=>{
        const label = timeLabelFrom24h(time24+':00');
        const isUnavail = unavailable.includes(time24);
        const selected = b.time===time24;
        return `<button class="slot-btn ${selected?'selected':''}" ${isUnavail?'disabled':''} onclick="selectTime('${time24}','${label}')">
          ${label}<span class="sub">${isUnavail?t('unavailableLabel'):'MYT'}</span>
        </button>`;
      }).join('')}
    </div>
    ${wizardNav(!!b.time)}
  `;
}

async function confirmBooking(){
  const b = state.booking;
  setBtnLoading('wizard-next-btn', true, state.lang==='ms' ? 'Menyimpan...' : 'Saving...');

  if(b.rescheduleOf){
    const { error } = await sb.from('appointments').update({
      appointment_date: b.date,
      appointment_time: b.time,
      status: 'Upcoming',
      updated_at: new Date().toISOString(),
    }).eq('id', b.rescheduleOf);
    setBtnLoading('wizard-next-btn', false);
    if(error){
      if(error.code === '23505'){
        toast(state.lang==='ms' ? 'Maaf, slot ini baru sahaja ditempah. Sila pilih masa lain.' : 'Sorry, this slot was just taken. Please pick another time.', 'error');
        await loadBookedSlots(); goStep(5); return;
      }
      toast((state.lang==='ms'?'Jadual semula gagal: ':'Reschedule failed: ')+error.message, 'error');
      return;
    }
    await loadAppData();
    toast(t('toastRescheduled'), 'success');
    go('myapts');
    return;
  }

  const { data, error } = await sb.from('appointments').insert({
    user_id: state.user.id,
    service_id: b.service,
    team_member_id: b.officer,
    appointment_type: b.type,
    appointment_date: b.date,
    appointment_time: b.time,
    purpose: b.purpose,
    meeting_link_status: b.type==='Online Video' ? 'pending' : 'not_applicable',
  }).select().single();

  setBtnLoading('wizard-next-btn', false);

  if(error){
    if(error.code === '23505'){
      toast(state.lang==='ms' ? 'Maaf, slot ini baru sahaja ditempah orang lain. Sila pilih masa lain.' : 'Sorry, this slot was just booked by someone else. Please pick another time.', 'error');
      await loadBookedSlots(); goStep(5); return;
    }
    toast((state.lang==='ms'?'Tempahan gagal: ':'Booking failed: ')+error.message, 'error');
    return;
  }

  await loadAppData();
  state.lastBookingId = data.booking_ref;
  state.view = 'success';
  render();
  window.scrollTo(0,0);
}

async function confirmCancel(){
  const a = state.appointments.find(x=>x.id===state.pendingCancelId);
  const cancelId = state.pendingCancelId;

  if(!a){ render(); return; }
  const { error } = await sb.from('appointments').update({ status:'Cancelled', updated_at:new Date().toISOString() }).eq('id', a.dbId);
  if(error){

  await loadAppData();
  render();
  toast(t('toastCancelled'),'success');
}

/* ============================= PROFILE ============================= */
function renderProfile(){
  const u = state.user;
  return `
    <div class="page-head"><div class="eyebrow" style="margin-bottom:6px;">${t('accountEyebrow')}</div><h1>${t('profileTitle')}</h1><p>${t('profileSub')}</p></div>
    <div class="card content-narrow" style="padding:24px;">
      <div class="field"><label>${t('fullNameLabel')}</label><input value="${esc(u.name)}" disabled></div>
      <div class="field"><label>${t('emailLabel')}</label><input value="${esc(u.email)}" disabled></div>
      <div class="field"><label>${t('orgLabel')}</label><input value="${esc(u.org)}" disabled></div>
      <p style="font-size:12px; color:var(--ink-faint);">${t('profileNote')}</p>
    </div>
  `;
}

/* ============================= INIT ============================= */
async function initApp(){
  const { data } = await sb.auth.getSession();
  if(data.session){
    const profile = await loadProfile(data.session.user.id);
    state.user = {
      id: data.session.user.id,
      name: profile ? profile.full_name : data.session.user.email,
      email: data.session.user.email,
      org: profile ? profile.organisation : '',
      role: profile ? profile.role : 'user'
    };
    await loadAppData();
    state.view = 'dashboard';
  }
  render();
}
initApp();
</script>
</body>
</html>
